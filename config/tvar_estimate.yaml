indexes: ["VIX","VXO","JLN"]
commodities: null          # or e.g. ["GOLD","WTI"] or [101,205]
lags_set: [2,3,4]
delays_set: [1,2]
trim: 0.15
ngrid: 100
criterion: "BIC"          # or "AIC"
min_regime_share: 0.15
use_given_split: false
smooth_ma: 3              # 1 = no smoothing
window:
  start: "1990-01-01"     # or null
  end: null
out_dir: "data/models/tvar"
verbose: true
overwrite: true
max_commodities: null     # e.g. 5 while testing
require_both_stable: true
min_obs_per_regime: 60   # tighten if you want
standardize_y: true
report_theta_percentile: true
