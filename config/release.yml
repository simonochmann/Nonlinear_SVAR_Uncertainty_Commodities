
---

# config/release.yml

```yaml
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "pre-release" # or pin a version

      - name: Setup renv
        uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: Rscript -e "sessionInfo()"

      - name: Run 07 simulations (fast)
        run: Rscript scripts/07_shock_scenario_simulations.R

      - name: Run 08 decomposition
        run: Rscript scripts/08_forecast_decomposition.R

      - name: Package 09
        run: Rscript scripts/09_package_export.R

      - name: Upload release dir artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: output/releases/

      - name: Create GitHub Release (zip)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/releases/*.zip
            output/releases/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
